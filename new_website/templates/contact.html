{%extends 'base.html'%}

{% block title%}Contact{%endblock%}

{% block content%}
<section class="page-section" id=" 'contact">
    <div class="'container">
        <!-- contact section heading -->
         <h2 class="page-section-heading text-center text-uppercase text-secondary mb-0"> Contact Us </h2>
         <!-- icon divider -->
          <div class="divider-custom">
            <div class="'devider-custom-line"></div>
            <div class="'devider-custom-icon"><i class='fas fa-envelope'></i></div>
            <div class="devider-custom-line"></div>
          </div>

            <div class="text-center text-secondary mb-0">
                <p>
                    We do our best to respond to emails.
                </p>
                <p>
                    You can also send us an email at <a href="maailto:ninosokhadze1@gmail.com">ninosokhadze1@gmail.com</a>
                </p>

            </div>
        <!-- contact section form -->
         <div class="row">
            <div class="col-lg-8 mx-auto">
                <form id="contactForm" name="sentMessage" novalidate="novalidate">
                    <div class="control-group">
                        <div class="form-group floating-label-form-group controls mb-0 pb-2">
                            <label>Name</label>
                            <input class='form-control' id='name' type="text" placeholder="Name" required="required" data-validation-required-message="Please enter your name.">
                            <p class="help-block text-danger"></p>
                        </div>

                    </div>
                    <div class="control-group">
                        <div class="form-group floating-label-form-group controld mb-0 pb-2">
                            <label>Email Adress</label>
                            <input class='form-control' id='email' type="email" placeholder="Email adress" required="required" data-validation-required-message="Please enter your email.">
                            <p class="help-block text-danger"></p>

                        </div>

                    </div>

                    <div class="control-group">
                        <div class="form-group floating-label-form-group controld mb-0 pb-2">
                            <label>Message</label>
                            <input class='form-control' id='message' rows="5" placeholder="Message" required="required" data-validation-required-message="Please enter your message.">
                            <p class="help-block text-danger"></p>

                        </div>

                    </div>

                    <br/>
                    <div id="success"></div>
                    <div class="form-group"> <button class='btn nw-bg-primary btn-xl text-white' id="sendMessageButton" type="submit">Send</button> </div>

                </form>

            </div>

         </div>

    </div>
</section>

{%endblock%}
