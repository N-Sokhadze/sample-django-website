# you dont need version for here. it's an old way of doing things

x-service-volumes: &service-volumes
  - ./:/app/:rw,cached

services:
  website:
    image: new-website-tutorial:latest
    command: python manage.py runserver 0.0.0.0:8000
    volumes: *service-volumes
    ports:
      - '8000:8000'

